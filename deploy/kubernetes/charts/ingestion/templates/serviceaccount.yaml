{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ingestion.serviceAccountName" . }}
  labels:
    {{- include "ingestion.labels" . | nindent 4 }}
    azure.workload.identity/use: "true"
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
