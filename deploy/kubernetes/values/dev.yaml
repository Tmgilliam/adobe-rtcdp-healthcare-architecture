global:
  environment: development

ingestion:
  replicaCount: 2
  
  image:
    repository: rtcdp/ingestion
    tag: "latest"
    pullPolicy: Always

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  autoscaling:
    enabled: false

  config:
    batchSize: 100
    flushIntervalSeconds: 10
    retryAttempts: 3
    logLevel: debug

  nodeSelector: {}
